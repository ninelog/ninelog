<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>自分の成績｜ナインログ</title>
  <link rel="stylesheet" href="css/common.css">
  <!--
    自分の成績（CLAUDE.md 6.5章・11.7章のG・11.8章）
    - C-6：年度と範囲（全チーム合計・各チーム・ひとりの記録・各大会）を選んで、打撃と投手の成績を見る
    - C-6b：記録カレンダー（●自分の成績・○チームの試合。日を押すと、その日の成績と「直す」「入力する」）
    - C-6c：成績の推移グラフ（月ごとの打率・OPS・防御率。その月だけ／積み上げ）
    - C-6d：相手別・大会別・区分別の集計（自分の記録がある試合だけ。勝敗は出さない）
  -->
</head>
<body>
  <div id="nl-header"></div>
  <main class="nl-main">
    <div id="nl-alert" hidden></div>
    <p class="nl-loading" id="loading">読み込み中です…</p>

    <div id="content" hidden>
      <!-- 何を見るか：年度と範囲（6.5章） -->
      <section class="nl-card" id="filters">
        <div class="nl-pair">
          <div class="nl-field">
            <label for="season">年度</label>
            <select id="season"></select>
          </div>
          <div class="nl-field">
            <label for="scope">範囲</label>
            <select id="scope"></select>
          </div>
        </div>
        <p class="nl-note" id="scope-note"></p>
      </section>

      <!-- 記録が無いとき -->
      <section class="nl-card" id="empty" hidden>
        <p class="nl-empty" id="empty-text"></p>
        <p><a class="nl-btn nl-btn--block" href="input.html">成績を入力へ</a></p>
      </section>

      <!-- 打撃 -->
      <section class="nl-card" id="batting-card" hidden>
        <h2>打撃 <span class="nl-h2__sub" id="batting-games"></span></h2>
        <div class="nl-tiles nl-tiles--4" id="batting-rates"></div>
        <div class="nl-stats" id="batting-counts"></div>
        <p class="nl-note">率は、選んだ範囲の試合の数をすべて足してから計算しています。分母が0のときは「-」と出ます。</p>
      </section>

      <!-- 投手 -->
      <section class="nl-card" id="pitching-card" hidden>
        <h2>投手 <span class="nl-h2__sub" id="pitching-games"></span></h2>
        <div class="nl-tiles" id="pitching-rates"></div>
        <p class="nl-note">防御率 ＝ 自責点 × 7 ÷ 投球回（7回制のため）。</p>
      </section>


      <!-- 成績の推移グラフ（C-6c。11.4章・6.5章の trend） -->
      <section class="nl-card" id="trend-card" hidden>
        <h2>成績の推移（月ごと）</h2>
        <div class="nl-seg nl-seg--sm" role="group" aria-label="グラフにする成績" id="trend-kind">
          <button type="button" class="nl-seg__btn" data-kind="avg" aria-pressed="true">打率</button>
          <button type="button" class="nl-seg__btn" data-kind="ops" aria-pressed="false">OPS</button>
          <button type="button" class="nl-seg__btn" data-kind="era" aria-pressed="false">防御率</button>
        </div>
        <div class="nl-seg nl-seg--sm" role="group" aria-label="計算のしかた" id="trend-mode">
          <button type="button" class="nl-seg__btn" data-mode="month" aria-pressed="true">その月だけ</button>
          <button type="button" class="nl-seg__btn" data-mode="cum" aria-pressed="false">積み上げ</button>
        </div>
        <div class="nl-chart"><canvas id="trend-chart" role="img" aria-label="成績の推移のグラフ"></canvas></div>
        <p class="nl-note" id="trend-note"></p>
        <details class="nl-fold nl-fold--sm">
          <summary><span>数字で見る</span></summary>
          <table class="nl-table" id="trend-table"></table>
        </details>
      </section>

      <!-- 相手別・大会別・区分別の集計（C-6d。11.4章。中身は js/breakdown.js が作る） -->
      <section class="nl-card" id="bd-card" hidden></section>

      <!-- 記録カレンダー（C-6b。11.3章）：●自分の成績・○チームの試合。日を押すと、その日の試合と成績 -->
      <section class="nl-card" id="cal-card">
        <h2>記録カレンダー</h2>
        <p class="nl-note" id="cal-note" style="margin-top:0"></p>
        <div id="cal"></div>
        <div id="day" aria-live="polite"></div>
      </section>
    </div>
  </main>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="js/config.js"></script>
  <script src="js/liff-app.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/breakdown.js"></script>
  <!-- グラフの部品 Chart.js（無料。11.0章の10）。版を決めて読み、中身が変わっていないかを integrity で確かめる -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" integrity="sha512-CQBWl4fJHWbryGE+Pc7UAxWMUMNMWzWxF4SQo9CgkJIN1kx6djDQZjh3Y8SZ1d+6I+1zze6Z7kHXO7q3UyZAWw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="js/mystats.js"></script>
</body>
</html>
