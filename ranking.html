<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ランキング｜ナインログ</title>
  <link rel="stylesheet" href="css/common.css">
  <!--
    ランキング（CLAUDE.md 6.2〜6.4章・11.8章）
    - C-7：チームと年度を選び、8部門を切り替えて、チーム内ランキングを見る
    - C-8：規定未達の人に「あと○打席」「あと○回」を出す（このあと作る）
    - C-7b：チーム全体の成績、C-7c：共有ボタン、C-7d：大会のランキング（このあと作る）
  -->
</head>
<body>
  <div id="nl-header"></div>
  <main class="nl-main">
    <div id="nl-alert" hidden></div>
    <p class="nl-loading" id="loading">読み込み中です…</p>

    <!-- チームに入っていないとき（ひとりの記録だけの人も。11.8章の7） -->
    <section class="nl-card" id="no-team" hidden>
      <h2>ランキングは、チームに参加すると見られます</h2>
      <p class="nl-note">代表者から「番号」と「合言葉」を教えてもらい、「チーム・設定」の画面で参加してください。ひとりの記録には、ランキングはありません。</p>
      <p><a class="nl-btn nl-btn--block" href="team.html">チーム・設定へ</a></p>
    </section>

    <div id="content" hidden>
      <!-- 何を見るか：チームと年度 -->
      <section class="nl-card" id="filters">
        <div class="nl-pair">
          <div class="nl-field">
            <label for="team">チーム</label>
            <select id="team"></select>
          </div>
          <div class="nl-field">
            <label for="season">年度</label>
            <select id="season"></select>
          </div>
        </div>
        <p class="nl-note" id="qualify-note"></p>
      </section>

      <!-- ランキング -->
      <section class="nl-card" id="ranking-card">
        <div class="nl-cats" id="cats" role="group" aria-label="部門"></div>
        <p class="nl-note" id="cat-note"></p>
        <ol class="nl-rank" id="rows"></ol>
      </section>
    </div>
  </main>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="js/config.js"></script>
  <script src="js/liff-app.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/ranking.js"></script>
</body>
</html>
