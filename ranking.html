<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ランキング｜ナインログ</title>
  <link rel="stylesheet" href="css/common.css">
  <!--
    ランキング（CLAUDE.md 6.2〜6.4章・11.8章）
    - C-7：チームと年度を選び、8部門を切り替えて、チーム内ランキングを見る
    - C-8：規定未達の人に「あと○打席」「あと○回」を出す
    - C-7b：チーム全体の成績（勝敗・勝率・チーム打率・防御率・相手別などの集計）
    - C-7c：ランキングをLINEのグループや友だちに共有する（シェアターゲットピッカー）
    - C-7d：大会のランキング（チームと大会を1つの選択欄で切り替え、表示名にチーム名を添える）
  -->
</head>
<body>
  <div id="nl-header"></div>
  <main class="nl-main">
    <div id="nl-alert" hidden></div>
    <p class="nl-loading" id="loading">読み込み中です…</p>

    <!-- チームに入っていないとき（個人用の記録だけの人も。11.8章の7） -->
    <section class="nl-card" id="no-team" hidden>
      <h2>ランキングは、チームに参加すると見られます</h2>
      <p class="nl-note">代表者から「ID」と「合言葉」を教えてもらい、「チーム・設定」の画面で参加してください（大会のIDと合言葉でも参加できます）。個人用の記録には、ランキングはありません。</p>
      <p><a class="nl-btn nl-btn--block" href="team.html">チーム・設定へ</a></p>
    </section>

    <div id="content" hidden>
      <!-- 何を見るか：チームと年度 -->
      <section class="nl-card" id="filters">
        <div class="nl-pair">
          <div class="nl-field">
            <label for="team">チーム・大会</label>
            <select id="team"></select>
          </div>
          <div class="nl-field">
            <label for="season">年度</label>
            <select id="season"></select>
          </div>
        </div>
        <p class="nl-note" id="qualify-note"></p>
      </section>

      <!-- 何を見るか：ランキングか、チーム全体の成績か（C-7b。11.0章の12） -->
      <div class="nl-seg" role="group" aria-label="見るもの" id="view">
        <button type="button" class="nl-seg__btn" data-view="ranking" aria-pressed="true">ランキング</button>
        <button type="button" class="nl-seg__btn" data-view="team" aria-pressed="false">チームの成績</button>
      </div>

      <!-- ランキング -->
      <section class="nl-card" id="ranking-card">
        <div class="nl-cats" id="cats" role="group" aria-label="部門"></div>
        <p class="nl-note" id="cat-note"></p>
        <ol class="nl-rank" id="rows"></ol>
        <!-- LINEで共有する（C-7c。11.5章）：利用者本人のLINEから送るので、公式LINEの配信数は使わない -->
        <div class="nl-share" id="share">
          <!-- 何人まで送るか（2026-11-14 利用者が追加。送る人なら誰でも選べる） -->
          <div class="nl-seg nl-seg--sm" role="group" aria-label="共有する人数" id="share-count">
            <button type="button" class="nl-seg__btn" data-count="3" aria-pressed="true">上位3人</button>
            <button type="button" class="nl-seg__btn" data-count="5" aria-pressed="false">5人</button>
            <button type="button" class="nl-seg__btn" data-count="10" aria-pressed="false">10人</button>
            <button type="button" class="nl-seg__btn" data-count="all" aria-pressed="false">全員</button>
          </div>
          <button type="button" class="nl-btn nl-btn--block" id="btn-share">この部門の上位3人をLINEで共有する</button>
          <!-- 8部門の上位をまとめて1通で送る（年末の成績発表などに） -->
          <button type="button" class="nl-btn nl-btn--sub nl-btn--block" id="btn-share-all" style="margin-top:8px">全部門まとめて送る（上位3人）</button>
          <p class="nl-note" id="share-note"></p>
        </div>
      </section>

      <!-- チーム全体の成績（C-7b。11.4章・B-14） -->
      <div id="team-view" hidden>
        <section class="nl-card" id="ts-empty" hidden>
          <p class="nl-empty" id="ts-empty-text"></p>
        </section>
        <section class="nl-card" id="ts-record-card">
          <h2>勝敗 <span class="nl-h2__sub" id="ts-games"></span></h2>
          <div class="nl-tiles nl-tiles--4" id="ts-record"></div>
          <p class="nl-note" id="ts-record-note"></p>
        </section>
        <section class="nl-card" id="ts-batting-card">
          <h2>チームの打撃 <span class="nl-h2__sub" id="ts-batting-sub"></span></h2>
          <div class="nl-tiles nl-tiles--4" id="ts-batting-rates"></div>
          <div class="nl-stats" id="ts-batting-counts"></div>
        </section>
        <section class="nl-card" id="ts-pitching-card">
          <h2>チームの投手 <span class="nl-h2__sub" id="ts-pitching-sub"></span></h2>
          <div class="nl-tiles" id="ts-pitching-rates"></div>
          <p class="nl-note">防御率 ＝ 自責点 × 7 ÷ 投球回（7回制のため）。</p>
        </section>
        <!-- 相手別・大会別・区分別（勝敗の表も出す。中身は js/breakdown.js が作る） -->
        <section class="nl-card" id="ts-bd-card" hidden></section>
        <p class="nl-note">チームの成績は、チームの全員の成績を足してから計算しています（退会した人の成績も入ります）。</p>
      </div>
    </div>
  </main>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="js/config.js"></script>
  <script src="js/liff-app.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/breakdown.js"></script>
  <script src="js/ranking.js"></script>
</body>
</html>
