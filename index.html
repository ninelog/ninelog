<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ナインログ</title>
  <link rel="stylesheet" href="css/common.css">
  <!--
    ナインログのトップ画面（C-1・C-2・C-3）。
    - LIFFはまずこのページを開いてから目的のページへ移動するため、このページにも必ず liff.init() を入れる（CLAUDE.md 3.4章）。
      リッチメニューから input.html などを開いたときは、URLに liff.state が付いていて、liff.init の中で自動で移動する。
    - このページを直接開いたときは、「接続の確認」として、GASが確かめた本人の情報を出す（C-2・8.7章の管理者の登録に使う）。
  -->
  <style>
    dl { margin: 0; }
    dt { color: var(--sub); font-size: 13px; margin-top: 12px; }
    dt:first-child { margin-top: 0; }
    dd { margin: 2px 0 0; word-break: break-all; }
    .user-id { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 14px; }
  </style>
</head>
<body>
  <div id="nl-header"></div>
  <main class="nl-main">
    <div id="nl-alert" hidden></div>
    <p class="nl-loading" id="status">読み込み中です…</p>

    <section class="nl-card" id="whoami" hidden>
      <h2>接続の確認</h2>
      <dl>
        <dt>表示名（ランキングに出る名前）</dt>
        <dd id="display-name"></dd>
        <dt>LINEの名前</dt>
        <dd id="line-name"></dd>
        <dt>管理者</dt>
        <dd id="is-admin"></dd>
        <dt>LINEユーザーID</dt>
        <dd class="user-id" id="user-id"></dd>
      </dl>
      <p><button type="button" class="nl-btn nl-btn--sub" id="copy-id">ユーザーIDをコピー</button></p>
      <p class="nl-note">
        この画面の内容は、サーバー（GAS）がLINEに問い合わせて確かめた、あなたの情報です。<br>
        ユーザーIDは、管理者の登録のときだけ使います。チャットなどに貼り付けないでください。
      </p>
    </section>

    <!-- 通信にかかった時間（2026-11-14：読み込みを速くする方法を考えるため。このスマホに残した最近の40件） -->
    <section class="nl-card" id="timing" hidden>
      <h2>通信にかかった時間</h2>
      <p class="nl-note" style="margin-top:0">このスマホで最近使った操作の時間です（成績や名前は残していません）。それぞれの画面を何回か開いてから、ここを見てください。</p>
      <table class="nl-table" id="timing-summary"></table>
      <details class="nl-fold nl-fold--sm">
        <summary><span>1回ずつ見る</span></summary>
        <table class="nl-table" id="timing-list"></table>
      </details>
      <p><button type="button" class="nl-btn nl-btn--sub" id="timing-clear">記録を消す</button></p>
    </section>
  </main>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="js/config.js"></script>
  <script src="js/liff-app.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (function () {
      const $ = function (id) { return document.getElementById(id); };
      // リッチメニューから別のページを開いたときは、liff.init が目的のページへ移動するので、確認は出さない
      const goingElsewhere = new URLSearchParams(location.search).has('liff.state');

      NinelogUI.boot('', '接続の確認', function () {
        if (goingElsewhere) return null;
        $('status').textContent = 'サーバーに確認しています…';
        return NinelogApp.call('whoami').then(function (me) {
          $('display-name').textContent = me.displayName;
          $('line-name').textContent = me.lineName || '（取得できませんでした）';
          $('is-admin').textContent = me.isAdmin ? 'はい' : 'いいえ';
          $('user-id').textContent = me.userId;
          $('status').hidden = true;
          $('whoami').hidden = false;
          NinelogUI.showOk('LINEのログインと、サーバーでの本人確認ができました', $('whoami'));
          renderTiming(); // 今の確認にかかった時間も出す
        }).catch(function (err) {
          $('status').hidden = true;
          NinelogUI.showError(err);
          renderTiming();
        });
      });

      /** 通信にかかった時間を、操作ごとのまとめ（回数・平均・いちばん長い）と、1回ずつの表で出す */
      function renderTiming() {
        const list = NinelogApp.readTimings();
        $('timing').hidden = false;
        const sum = $('timing-summary');
        const rows = $('timing-list');
        sum.innerHTML = '';
        rows.innerHTML = '';
        const sec = function (ms) { return (ms / 1000).toFixed(1) + '秒'; };
        const tr = function (table, cells, head) {
          const row = document.createElement('tr');
          cells.forEach(function (c) { const td = document.createElement(head ? 'th' : 'td'); td.textContent = c; row.appendChild(td); });
          table.appendChild(row);
        };
        if (!list.length) { tr(sum, ['まだ記録がありません'], false); return; }
        const by = {};
        list.forEach(function (x) { (by[x.name] = by[x.name] || []).push(x.ms); });
        tr(sum, ['操作', '回数', '平均', '最長'], true);
        Object.keys(by).sort(function (a, b) {
          const avg = function (k) { return by[k].reduce(function (s, v) { return s + v; }, 0) / by[k].length; };
          return avg(b) - avg(a);
        }).forEach(function (k) {
          const v = by[k];
          tr(sum, [k, String(v.length), sec(v.reduce(function (s, x) { return s + x; }, 0) / v.length), sec(Math.max.apply(null, v))], false);
        });
        tr(rows, ['時刻', '操作', '時間', ''], true);
        list.slice().reverse().forEach(function (x) { tr(rows, [x.at, x.name, sec(x.ms), x.ok ? '' : '失敗'], false); });
      }
      if (!goingElsewhere) renderTiming();
      $('timing-clear').addEventListener('click', function () { NinelogApp.clearTimings(); renderTiming(); });

      $('copy-id').addEventListener('click', function () {
        navigator.clipboard.writeText($('user-id').textContent).then(function () {
          $('copy-id').textContent = 'コピーしました';
        }, function () {
          $('copy-id').textContent = 'コピーできませんでした（長押しで選んでください）';
        });
      });
    })();
  </script>
</body>
</html>
